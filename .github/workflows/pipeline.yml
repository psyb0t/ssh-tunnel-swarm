name: pipeline

# Every branch push builds the merged script, runs shellcheck and the unit
# tests, and refreshes the badges on master. A v* tag does not rerun the
# checks: it waits for that commit's master run to succeed, cuts the GitHub
# release from the annotated tag message, uploads the merged
# ssh-tunnel-swarm script that tools/downloader.sh installs, and publishes the
# skill to ClawHub.
on: [push]

permissions: {}

jobs:
  # make lint and make test run their tools in pinned containers, so the
  # runner needs only Docker, Make and Bash.
  code:
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      build_command: "make build"
      lint_command: "make lint"
      test_command: "make test"

  wait:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/wait-for-default-branch.yml@master

  release:
    needs: [wait]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/release-workflow.yml@master

  # release-workflow.yml attaches nothing, and the installer downloads the
  # asset named ssh-tunnel-swarm from the release, so build it from the tag
  # and upload it here.
  release-asset:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build
        run: make build

      - name: Upload the merged script
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" build/ssh-tunnel-swarm --clobber

  badges:
    needs: [code, wait]
    if: "always() && ((github.ref_name == github.event.repository.default_branch && needs.code.result == 'success') || (startsWith(github.ref, 'refs/tags/') && needs.wait.result == 'success'))"
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master

  publish-to-clawhub:
    needs: [release-asset]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    with:
      skill_names: '["ssh-tunnel-swarm"]'
      plugin_names: "[]"
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
